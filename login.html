<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access | Campus Grievance Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4338ca 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      padding: 35px 30px;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border: none;
      color: white;
      font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn-gradient:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      color: white;
    }
    .nav-pills {
      background: #e0e7ff;
      border-radius: 10px;
      padding: 4px;
    }
    .nav-pills .nav-link {
      color: #4338ca;
      font-weight: 600;
      border-radius: 8px;
      padding: 8px 0;
    }
    .nav-pills .nav-link.active {
      background-color: #4f46e5;
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.2);
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-4">
    <div style="font-size: 2.2rem;">🎓</div>
    <h4 class="fw-bold text-dark mb-1">Campus Grievance Desk</h4>
    <p class="text-muted small">Log in or create an account to lodge issues</p>
  </div>

  <ul class="nav nav-pills nav-justified mb-4" id="authTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#loginPane" type="button" role="tab">Login</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signupPane" type="button" role="tab">Register</button>
    </li>
  </ul>

  <div class="tab-content" id="authTabContent">
    <!-- Login Tab -->
    <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
      <form action="/auth/login" method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">College Email</label>
          <input type="email" name="email" class="form-control" placeholder="name@college.edu" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold text-secondary">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3">Access Portal</button>
      </form>
    </div>

    <!-- Register Tab -->
    <div class="tab-pane fade" id="signupPane" role="tabpanel">
      <form action="/auth/register" method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. Mohit Singh" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">College Email</label>
          <input type="email" name="email" class="form-control" placeholder="name@college.edu" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold text-secondary">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Create password" required>
        </div>
        <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3">Register Account</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
