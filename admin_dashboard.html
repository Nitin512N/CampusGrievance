<!DOCTYPE html>
55<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Campus Grievance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      color: #0f172a;
    }
    .custom-navbar {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .table thead {
      background: #0f172a;
      color: #fff;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark custom-navbar px-4 sticky-top">
  <span class="navbar-brand mb-0 h1 fw-bold">🛡️ Administration Control Panel</span>
</nav>

<div class="container py-5">
  <div class="glass-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h4 class="fw-bold mb-1">Campus Grievance Records</h4>
        <p class="text-muted small mb-0">Review complaints and update status live</p>
      </div>
      <button class="btn btn-dark btn-sm px-3 rounded-pill" onclick="location.reload()">↻ Refresh Records</button>
    </div>

    <div class="table-responsive rounded-3 border">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th class="py-3">Ticket ID</th>
            <th>Student Details</th>
            <th>Category</th>
            <th>Subject</th>
            <th>Description</th>
            <th>Status</th>
            <th style="min-width: 220px;">Action / Update</th>
          </tr>
        </thead>
        <tbody>
          <!--COMPLAINTS_TABLE_ROWS-->
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
